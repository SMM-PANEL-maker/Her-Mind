<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Her Mind Admin</title>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    header {
      background: #ffd400;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 22px;
    }

    button {
      border: none;
      border-radius: 7px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .logout {
      background: #111;
      color: white;
    }

    .container {
      width: 95%;
      max-width: 1000px;
      margin: 25px auto;
    }

    .login-box,
    .admin-box {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    .login-box {
      max-width: 450px;
      margin: 60px auto;
    }

    h2 {
      margin-bottom: 20px;
    }

    h3 {
      margin-bottom: 15px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      margin: 8px 0 15px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
    }

    .primary {
      background: #111;
      color: white;
      width: 100%;
    }

    .message {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      display: none;
    }

    .success {
      background: #d9f7df;
      color: #176b2c;
    }

    .error {
      background: #ffdede;
      color: #a00000;
    }

    #adminPanel {
      display: none;
    }

    .post {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
    }

    .post h4 {
      margin-bottom: 8px;
    }

    .post p {
      white-space: pre-wrap;
      color: #555;
      line-height: 1.5;
    }

    .delete {
      background: #d60000;
      color: white;
      margin-top: 12px;
    }

    .edit {
      background: #ffd400;
      color: #111;
      margin-top: 12px;
      margin-right: 5px;
    }

    .hidden {
      display: none;
    }

    .loading {
      text-align: center;
      padding: 20px;
    }
  </style></head><body><header>
  <h1>Her Mind Admin</h1>
  <button class="logout" id="logoutBtn" onclick="logout()">Logout</button>
</header><div class="container">  <!-- LOGIN -->  <div class="login-box" id="loginBox"><h2>Admin Login</h2>

<input
  type="email"
  id="email"
  placeholder="Admin email"
  autocomplete="email"
>

<input
  type="password"
  id="password"
  placeholder="Password"
  autocomplete="current-password"
>

<button class="primary" onclick="login()">Login</button>

<div id="loginMessage" class="message"></div>

  </div>  <!-- ADMIN PANEL -->  <div id="adminPanel"><div class="admin-box">

  <h2>Publish New Content</h2>

  <input
    type="text"
    id="title"
    placeholder="Post title"
  >

  <select id="category">
    <option value="General">General</option>
    <option value="Relationships">Relationships</option>
    <option value="Women">Women</option>
    <option value="Health">Health</option>
    <option value="Lifestyle">Lifestyle</option>
    <option value="Career">Career</option>
    <option value="Finance">Finance</option>
  </select>

  <textarea
    id="content"
    placeholder="Write your article here..."
  ></textarea>

  <button class="primary" onclick="publishPost()">
    Publish Content
  </button>

  <div id="publishMessage" class="message"></div>

</div>


<br>


<div class="admin-box">

  <h2>Published Content</h2>

  <div id="posts">
    <div class="loading">Loading posts...</div>
  </div>

</div>

  </div></div><script>

  // ==============================
  // SUPABASE CONFIGURATION
  // ==============================

  const SUPABASE_URL =
    "https://rdqjmvetzgvpjeqwozlz.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_b0htGuW0QV5OXgZ3T0Sq5w_OwAg8z42";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==============================
  // SHOW MESSAGE
  // ==============================

  function showMessage(element, text, type) {

    element.textContent = text;

    element.className =
      "message " + type;

    element.style.display = "block";

  }


  // ==============================
  // LOGIN
  // ==============================

  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const message =
      document.getElementById("loginMessage");


    if (!email || !password) {

      showMessage(
        message,
        "Enter your email and password.",
        "error"
      );

      return;
    }


    showMessage(
      message,
      "Logging in...",
      "success"
    );


    try {

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });


      if (error) {

        showMessage(
          message,
          error.message,
          "error"
        );

        return;
      }


      if (!data.session) {

        showMessage(
          message,
          "Login failed. No session was created.",
          "error"
        );

        return;
      }


      document.getElementById("loginBox").style.display =
        "none";

      document.getElementById("adminPanel").style.display =
        "block";

      document.getElementById("logoutBtn").style.display =
        "block";

      loadPosts();

    } catch (error) {

      showMessage(
        message,
        "Login error: " + error.message,
        "error"
      );

    }

  }


  // ==============================
  // CHECK EXISTING LOGIN
  // ==============================

  async function checkUser() {

    try {

      const { data } =
        await supabaseClient.auth.getSession();


      if (data.session) {

        document.getElementById("loginBox").style.display =
          "none";

        document.getElementById("adminPanel").style.display =
          "block";

        loadPosts();

      } else {

        document.getElementById("loginBox").style.display =
          "block";

        document.getElementById("adminPanel").style.display =
          "none";

      }

    } catch (error) {

      console.error(error);

    }

  }


  // ==============================
  // LOGOUT
  // ==============================

  async function logout() {

    await supabaseClient.auth.signOut();

    document.getElementById("adminPanel").style.display =
      "none";

    document.getElementById("loginBox").style.display =
      "block";

    document.getElementById("email").value = "";

    document.getElementById("password").value = "";

  }


  // ==============================
  // PUBLISH POST
  // ==============================

  async function publishPost() {

    const title =
      document.getElementById("title").value.trim();

    const category =
      document.getElementById("category").value;

    const content =
      document.getElementById("content").value.trim();

    const message =
      document.getElementById("publishMessage");


    if (!title || !content) {

      showMessage(
        message,
        "Please enter both a title and content.",
        "error"
      );

      return;
    }


    showMessage(
      message,
      "Publishing...",
      "success"
    );


    try {

      const {
        data: { user }
      } = await supabaseClient.auth.getUser();


      if (!user) {

        showMessage(
          message,
          "You are not logged in.",
          "error"
        );

        return;
      }


      const { error } =
        await supabaseClient
          .from("posts")
          .insert([
            {
              title: title,
              category: category,
              content: content,
              author_id: user.id
            }
          ]);


      if (error) {

        showMessage(
          message,
          "Publishing failed: " + error.message,
          "error"
        );

        return;
      }


      showMessage(
        message,
        "Content published successfully!",
        "success"
      );


      document.getElementById("title").value = "";

      document.getElementById("content").value = "";

      loadPosts();

    } catch (error) {

      showMessage(
        message,
        "Error: " + error.message,
        "error"
      );

    }

  }


  // ==============================
  // LOAD POSTS
  // ==============================

  async function loadPosts() {

    const postsContainer =
      document.getElementById("posts");


    postsContainer.innerHTML =
      '<div class="loading">Loading posts...</div>';


    try {

      const { data, error } =
        await supabaseClient
          .from("posts")
          .select("*")
          .order("created_at", {
            ascending: false
          });


      if (error) {

        postsContainer.innerHTML =
          "<p>Unable to load posts: " +
          error.message +
          "</p>";

        return;
      }


      if (!data || data.length === 0) {

        postsContainer.innerHTML =
          "<p>No published content yet.</p>";

        return;
      }


      postsContainer.innerHTML = "";


      data.forEach(post => {

        const div =
          document.createElement("div");

        div.className = "post";


        const title =
          document.createElement("h4");

        title.textContent =
          post.title;


        const category =
          document.createElement("small");

        category.textContent =
          post.category || "General";


        const content =
          document.createElement("p");

        content.textContent =
          post.content;


        const deleteButton =
          document.createElement("button");

        deleteButton.className =
          "delete";

        deleteButton.textContent =
          "Delete";

        deleteButton.onclick =
          () => deletePost(post.id);


        div.appendChild(title);

        div.appendChild(category);

        div.appendChild(content);

        div.appendChild(deleteButton);


        postsContainer.appendChild(div);

      });

    } catch (error) {

      postsContainer.innerHTML =
        "<p>Error loading content.</p>";

      console.error(error);

    }

  }


  // ==============================
  // DELETE POST
  // ==============================

  async function deletePost(id) {

    const confirmed =
      confirm("Delete this post?");


    if (!confirmed) return;


    const { error } =
      await supabaseClient
        .from("posts")
        .delete()
        .eq("id", id);


    if (error) {

      alert(
        "Could not delete post: " +
        error.message
      );

      return;
    }


    loadPosts();

  }


  // ==============================
  // START
  // ==============================

  checkUser();

</script></body>
</html>
